# ─────────────────────────────────────────────────────────────────────────────
# EventHub Playwright CI
#
# Triggers:
#   • schedule: 01:30 UTC (7 am IST) Mon–Fri → full suite (ui + api + e2e)
#   • workflow_dispatch → manual run with optional suite selector
#
# Push / PR triggers are intentionally absent — we do not own EventHub,
# so there is no meaningful gate to run against a merge to main.
#
# Secrets required (set in GitHub repo → Settings → Secrets and variables):
#   BASE_URL        https://eventhub.rahulshettyacademy.com
#   LOGIN_EMAIL     ravitanna2015@gmail.com
#   LOGIN_PASSWORD  Ravitanna@2015
#   API_TOKEN       (leave empty if not using a pre-seeded token)
# ─────────────────────────────────────────────────────────────────────────────

name: Playwright Tests

on:
  # 7:00 am IST = 01:30 UTC — run the full suite Mon–Fri
  schedule:
    - cron: '30 1 * * 1-5'

  # Manual trigger — choose which suite to run
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression
          - ui
          - api
          - e2e

# ─── Environment variables available to all jobs ──────────────────────────────
env:
  BASE_URL:       ${{ secrets.BASE_URL }}
  LOGIN_EMAIL:    ${{ secrets.LOGIN_EMAIL }}
  LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
  API_TOKEN:      ${{ secrets.API_TOKEN }}
  USER_EMAIL:     ${{ secrets.LOGIN_EMAIL }}
  USER_PASSWORD:  ${{ secrets.LOGIN_PASSWORD }}

# ─── Jobs ────────────────────────────────────────────────────────────────────

jobs:

  # ── Full suite: runs on schedule and manual dispatch ─────────────────────────
  full:
    name: Full Suite (${{ github.event.inputs.suite || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Save auth state
        run: npx playwright test --project=setup

      - name: Run selected suite
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npx playwright test tests/ui/ tests/api/ tests/e2e/
          elif [ "${{ inputs.suite }}" = "smoke" ]; then
            npx playwright test tests/ui/ tests/api/ tests/e2e/ --grep @smoke
          elif [ "${{ inputs.suite }}" = "regression" ]; then
            npx playwright test tests/ui/ tests/api/ tests/e2e/ --grep @regression
          elif [ "${{ inputs.suite }}" = "ui" ]; then
            npx playwright test tests/ui/
          elif [ "${{ inputs.suite }}" = "api" ]; then
            npx playwright test tests/api/
          elif [ "${{ inputs.suite }}" = "e2e" ]; then
            npx playwright test tests/e2e/
          else
            npx playwright test tests/ui/ tests/api/ tests/e2e/
          fi

      - name: Generate and push test summary
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const https = require('https');

          function makeGitHubRequest(method, path, data = null) {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: 'api.github.com',
                path: path,
                method: method,
                headers: {
                  'Authorization': 'token ${{ secrets.GITHUB_TOKEN }}',
                  'Accept': 'application/vnd.github.v3+json',
                  'User-Agent': 'GitHub Actions'
                }
              };
              const req = https.request(options, (res) => {
                let body = '';
                res.on('data', chunk => body += chunk);
                res.on('end', () => {
                  try {
                    resolve({ status: res.statusCode, body: JSON.parse(body) });
                  } catch {
                    resolve({ status: res.statusCode, body: body });
                  }
                });
              });
              req.on('error', reject);
              if (data) req.write(JSON.stringify(data));
              req.end();
            });
          }

          async function main() {
            const resultsPath = 'test-results/results.json';
            let passed = 0, failed = 0, skipped = 0;
            const failedTests = [];

            if (!fs.existsSync(resultsPath)) {
              const summary = {
                run_number: process.env.GITHUB_RUN_NUMBER,
                timestamp: new Date().toISOString(),
                passed: 0,
                failed: 0,
                skipped: 0,
                total: 0,
                failedTests: [],
                error: 'results.json not found'
              };
              console.log('Summary:', JSON.stringify(summary));
              return summary;
            }

            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));

            function walkSuites(suites = []) {
              for (const suite of suites) {
                if (suite.suites) walkSuites(suite.suites);
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    for (const result of test.results || []) {
                      if (result.status === 'passed') passed++;
                      else if (result.status === 'failed') {
                        failed++;
                        const tcMatch = spec.title.match(/\[TC-\d+\]/) || test.title.match(/\[TC-\d+\]/);
                        if (tcMatch) failedTests.push(tcMatch[0]);
                      }
                      else if (result.status === 'skipped') skipped++;
                    }
                  }
                }
              }
            }

            walkSuites(results.suites);

            const summary = {
              run_number: process.env.GITHUB_RUN_NUMBER,
              timestamp: new Date().toISOString(),
              passed,
              failed,
              skipped,
              total: passed + failed + skipped,
              failedTests
            };

            console.log('Summary:', JSON.stringify(summary, null, 2));

            // Get existing file SHA
            const repo = process.env.GITHUB_REPOSITORY;
            const getRes = await makeGitHubRequest('GET', \`/repos/\${repo}/contents/test-summary.json\`);
            const sha = getRes.status === 200 ? getRes.body.sha : null;

            // Push to repo
            const content = Buffer.from(JSON.stringify(summary, null, 2)).toString('base64');
            const updateData = {
              message: \`ci: update test summary for run \${process.env.GITHUB_RUN_NUMBER}\`,
              content: content,
              branch: 'main'
            };
            if (sha) updateData.sha = sha;

            const putRes = await makeGitHubRequest('PUT', \`/repos/\${repo}/contents/test-summary.json\`, updateData);
            console.log('GitHub API response:', putRes.status);
          }

          main().catch(err => {
            console.error('Error:', err);
            process.exit(1);
          });
          "

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results JSON
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/results.json
          retention-days: 30

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: failure-screenshots-${{ github.run_number }}
          path: test-results/**/*.png
          retention-days: 7
