# ─────────────────────────────────────────────────────────────────────────────
# EventHub Playwright CI
#
# Triggers:
#   • schedule: 01:30 UTC (7 am IST) Mon–Fri → full suite (ui + api + e2e)
#   • workflow_dispatch → manual run with optional suite selector
#
# Push / PR triggers are intentionally absent — we do not own EventHub,
# so there is no meaningful gate to run against a merge to main.
#
# Secrets required (set in GitHub repo → Settings → Secrets and variables):
#   BASE_URL        https://eventhub.rahulshettyacademy.com
#   LOGIN_EMAIL     ravitanna2015@gmail.com
#   LOGIN_PASSWORD  Ravitanna@2015
#   API_TOKEN       (leave empty if not using a pre-seeded token)
# ─────────────────────────────────────────────────────────────────────────────

name: Playwright Tests

on:
  # 7:00 am IST = 01:30 UTC — run the full suite Mon–Fri
  schedule:
    - cron: '30 1 * * 1-5'

  # Manual trigger — choose which suite to run
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression
          - ui
          - api
          - e2e

# ─── Environment variables available to all jobs ──────────────────────────────
env:
  BASE_URL:       ${{ secrets.BASE_URL }}
  LOGIN_EMAIL:    ${{ secrets.LOGIN_EMAIL }}
  LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
  API_TOKEN:      ${{ secrets.API_TOKEN }}
  USER_EMAIL:     ${{ secrets.LOGIN_EMAIL }}
  USER_PASSWORD:  ${{ secrets.LOGIN_PASSWORD }}

# ─── Jobs ────────────────────────────────────────────────────────────────────

jobs:

  # ── Full suite: runs on schedule and manual dispatch ─────────────────────────
  full:
    name: Full Suite (${{ github.event.inputs.suite || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Save auth state
        run: npx playwright test --project=setup

      - name: Run selected suite
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npx playwright test tests/ui/ tests/api/ tests/e2e/
          elif [ "${{ inputs.suite }}" = "smoke" ]; then
            npx playwright test tests/ui/ tests/api/ tests/e2e/ --grep @smoke
          elif [ "${{ inputs.suite }}" = "regression" ]; then
            npx playwright test tests/ui/ tests/api/ tests/e2e/ --grep @regression
          elif [ "${{ inputs.suite }}" = "ui" ]; then
            npx playwright test tests/ui/
          elif [ "${{ inputs.suite }}" = "api" ]; then
            npx playwright test tests/api/
          elif [ "${{ inputs.suite }}" = "e2e" ]; then
            npx playwright test tests/e2e/
          else
            npx playwright test tests/ui/ tests/api/ tests/e2e/
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results JSON
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/results.json
          retention-days: 30

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: failure-screenshots-${{ github.run_number }}
          path: test-results/**/*.png
          retention-days: 7
